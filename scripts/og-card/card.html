<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Cormorant; src: url("fonts/cormorant-garamond-600-normal-latin.woff2") format("woff2"); font-weight: 600; font-style: normal; }
  @font-face { font-family: Cormorant; src: url("fonts/cormorant-garamond-500-italic-latin.woff2") format("woff2"); font-weight: 500; font-style: italic; }
  @font-face { font-family: Jost; src: url("fonts/jost-400-normal-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: Jost; src: url("fonts/jost-500-normal-latin.woff2") format("woff2"); font-weight: 500; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    /* Lodret, ikke diagonalt. Stoppene er samplet fra det oprindelige kort,
       så den nye version står side om side med den gamle i folks feeds
       uden at se ud som to forskellige brands. */
    background: linear-gradient(180deg, #FAF5F2 0%, #F4E9E5 50%, #EFD9D6 100%);
    display: flex; align-items: center; justify-content: center;
    font-kerning: normal; -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute; inset: 24px;
    border: 1px solid #C4AA85; border-radius: 6px; opacity: .55;
  }
  .stack { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .mark { height: 60px; width: auto; margin-bottom: 26px; }
  .eyebrow {
    font-family: Jost, sans-serif; font-weight: 500; font-size: 19px;
    letter-spacing: .22em; text-transform: uppercase; color: #8C5560;
  }
  .name {
    font-family: Cormorant, Georgia, serif; font-weight: 600; font-size: 88px;
    line-height: 1.04; color: #2E2523; margin-top: 16px; letter-spacing: .005em;
  }
  .tagline {
    font-family: Cormorant, Georgia, serif; font-weight: 500; font-style: italic;
    font-size: 36px; color: #7A3A44; margin-top: 6px;
  }
  .rule { width: 92px; height: 1px; background: #C4AA85; margin: 26px 0 20px; }
  .place {
    font-family: Jost, sans-serif; font-weight: 400; font-size: 19px;
    letter-spacing: .06em; color: #6F615C;
  }
</style></head>
<body>
  <div class="frame"></div>
  <div class="stack">
    <img class="mark" src="img/logo-wg.png" alt="">
    <p class="eyebrow">__EYEBROW__</p>
    <h1 class="name">__NAME__</h1>
    <p class="tagline">__TAGLINE__</p>
    <div class="rule"></div>
    <p class="place">__PLACE__</p>
  </div>
</body></html>
