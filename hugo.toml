# ⚠ MIDLERTIDIG: peger på Christians demo-subdomæne, fordi wiktoriagordon.dk endnu
# ikke er sat op. Uden dette virker OG-billede/canonical/schema-URL'er ikke, fordi de
# bruger absURL (= baseURL) — og pegede før på et domæne der ikke findes endnu, så
# Facebook/Instagrams link-preview-crawler fik "server not found".
# RET TIL "https://www.wiktoriagordon.dk/" NÅR DOMÆNET ER LIVE PÅ CLOUDFLARE.
baseURL = "https://wiktoria.christiansdemo.dk/"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Giver sitemap'et et ærligt <lastmod>. Hugo læser commit-datoen for
# content/_index.md. Bemærk: teksten bor i data/*.yaml, så en CMS-rettelse
# flytter ikke datoen — den er "sidste gang sidens ramme blev rørt", ikke
# "sidste gang et komma blev rettet". Bedre end ingen dato, ikke mere.
enableGitInfo = true

defaultContentLanguage = "da"
defaultContentLanguageInSubdir = false   # dansk på /, engelsk på /en/

# =====================================================================
#  Sprog
# =====================================================================
[languages]
  [languages.da]
    locale = "da-DK"
    label = "Dansk"
    weight = 1
    title = "Wiktoria Gordon Beauty"
    [languages.da.params]
      ogLocale = "da_DK"
      country = "Danmark"

  [languages.en]
    locale = "en-GB"
    label = "English"
    weight = 2
    title = "Wiktoria Gordon Beauty"
    [languages.en.params]
      ogLocale = "en_DK"
      country = "Denmark"

[markup.goldmark.renderer]
  unsafe = false

# =====================================================================
#  Sitemap
# =====================================================================
[sitemap]
  changefreq = "monthly"
  priority = 0.5

# =====================================================================
#  Output-formater
#  LLMS = /llms.txt (og /en/llms.txt): en ren tekstopsummering af hele
#  sitet, skrevet til sprogmodeller. Genereres fra de samme data/*.yaml
#  som siden selv, så den aldrig kan komme ud af sync med indholdet.
# =====================================================================
[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "LLMS"]

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepWhitespace = false
