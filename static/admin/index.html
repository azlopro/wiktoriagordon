<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Edit your website · Wiktoria Gordon Beauty</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css">

  <!--
    Sveltia CMS ligger som en fil i repoet, ikke på et CDN.
    Grunde: (1) en opdatering opstrøms kan ikke ødelægge panelet fra den
    ene dag til den anden, (2) /admin henter ingenting udefra.
    Opdatering sker bevidst: hent en ny version, læg den her, test, commit.

    Nødudgang: configen er Decap-kompatibel. Dør Sveltia, kan denne ene
    linje skiftes til Decap CMS uden at røre config.yml.
  -->
  <script src="/admin/bootstrap.js"></script>
  <script src="/admin/sveltia-cms.js"></script>
  <script src="/admin/previews.js"></script>

</head>
<body>
  <header id="intro">
    <div class="intro-main">
      <div class="intro-title">
        <img src="/favicon.png" alt="" width="32" height="32">
        <div>
          <strong>Website editor</strong>
          <p>Edit both <b>DA</b> and <b>EN</b>, save, then allow 1–2 minutes for the live site to update.</p>
        </div>
      </div>
      <nav class="intro-tools" aria-label="Website tools">
        <a href="/admin/guide.html" target="_blank">Help</a>
        <a class="view-site" href="/" target="_blank" rel="noopener">View website</a>
      </nav>
    </div>
    <nav class="quick-actions" aria-label="Common website changes">
      <span>Quick edit</span>
      <a href="#/collections/website/entries/services">Prices &amp; treatments</a>
      <a href="#/collections/website/entries/business">Opening hours &amp; contact</a>
      <a href="#/collections/website/entries/images">Main photos</a>
      <a href="#/collections/website/entries/beforeafter">Before &amp; after</a>
    </nav>
  </header>

  <!-- CMS'et monteres HER i stedet for at overtage hele <body>,
       så intro-teksten ovenfor bliver stående. Id'et skal hedde
       nc-root - det er Sveltias faste navn. -->
  <div id="nc-root"></div>
</body>
</html>
