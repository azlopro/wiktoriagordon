<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Edit your website · Wiktoria Gordon Beauty</title>
  <link rel="icon" href="/favicon.svg">

  <!--
    Sveltia CMS ligger som en fil i repoet, ikke på et CDN.
    Grunde: (1) en opdatering opstrøms kan ikke ødelægge panelet fra den
    ene dag til den anden, (2) /admin henter ingenting udefra.
    Opdatering sker bevidst: hent en ny version, læg den her, test, commit.

    Nødudgang: configen er Decap-kompatibel. Dør Sveltia, kan denne ene
    linje skiftes til Decap CMS uden at røre config.yml.
  -->
  <script src="/admin/bootstrap.js"></script>
  <script src="/admin/sveltia-cms.js"></script>
  <script src="/admin/previews.js"></script>

  <style>
    :root { color-scheme: light; }
    body { margin: 0; }
    #intro {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EEE4DA;
      color: #2E2523;
      padding: .8rem 1.25rem;
      border-bottom: 1px solid rgba(46, 37, 35, .12);
      font-size: .9rem;
      line-height: 1.45;
    }
    #intro .inner {
      width: min(100%, 76rem);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 1.5rem;
    }
    #intro p { margin: 0; max-width: 72ch; }
    #intro strong { color: #4D0E13; }
    #intro nav { display: flex; gap: .55rem; flex: none; }
    #intro a {
      color: #4D0E13;
      border: 1px solid rgba(77, 14, 19, .28);
      border-radius: 999px;
      padding: .45rem .75rem;
      text-decoration: none;
      font-weight: 650;
      white-space: nowrap;
    }
    #intro a:first-child { color: #fff; background: #4D0E13; }
    #intro a:hover { border-color: #4D0E13; }
    #nc-root { min-height: calc(100vh - 4.75rem); }
    @media (max-width: 720px) {
      #intro .inner { align-items: flex-start; flex-direction: column; }
      #intro nav { width: 100%; }
      #intro a { flex: 1; text-align: center; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: light dark; }
      #intro { background: #241d1c; color: #EFE6E2; border-bottom-color: rgba(255,255,255,.12); }
      #intro strong { color: #E6D6CF; }
      #intro a { color: #EFE6E2; border-color: rgba(255,255,255,.3); }
      #intro a:first-child { background: #E6D6CF; color: #241d1c; }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div class="inner">
      <p>
        Edit <strong>both DA and EN tabs</strong> and use the visual preview beside
        the form. Then press <strong>Save</strong> and check both live pages.
        Every save has version history and can be restored.
      </p>
      <nav aria-label="Editor help">
        <a href="/" target="_blank" rel="noopener">View website</a>
        <a href="/admin/guide.html" target="_blank">Editing guide</a>
      </nav>
    </div>
  </div>

  <!-- CMS'et monteres HER i stedet for at overtage hele <body>,
       så intro-teksten ovenfor bliver stående. Id'et skal hedde
       nc-root - det er Sveltias faste navn. -->
  <div id="nc-root"></div>
</body>
</html>
