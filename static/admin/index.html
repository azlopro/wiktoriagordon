<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Edit your website · Wiktoria Gordon Beauty</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css">

  <!--
    Sveltia CMS ligger som en fil i repoet, ikke på et CDN.
    Grunde: (1) en opdatering opstrøms kan ikke ødelægge panelet fra den
    ene dag til den anden, (2) /admin henter ingenting udefra.
    Opdatering sker bevidst: hent en ny version, læg den her, test, commit.

    Nødudgang: configen er Decap-kompatibel. Dør Sveltia, kan denne ene
    linje skiftes til Decap CMS uden at røre config.yml.
  -->
  <script src="/admin/bootstrap.js"></script>
  <script src="/admin/sveltia-cms.js"></script>
  <script src="/admin/previews.js"></script>

</head>
<body>
  <header id="intro">
    <div class="intro-inner">
      <p><strong>Website editor</strong><span>Edit both DA and EN, then check the live site after saving.</span></p>
      <nav aria-label="Website tools">
        <a href="/admin/review/">Review all text</a>
        <a href="/" target="_blank" rel="noopener">View website</a>
      </nav>
    </div>
  </header>

  <!-- CMS'et monteres HER i stedet for at overtage hele <body>,
       så intro-teksten ovenfor bliver stående. Id'et skal hedde
       nc-root - det er Sveltias faste navn. -->
  <div id="nc-root"></div>
</body>
</html>
