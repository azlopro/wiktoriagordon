{{- /* Cal-booking, hentet FØRST når den besøgende selv trykker.

   HVORFOR IKKE BARE ET SCRIPT:
   Cal-embedden sætter cookie og henter ~75 ting fra app.cal.eu, i det
   øjeblik siden loader. Som almindeligt <script> ville den altså behandle
   den besøgende, før nogen havde sagt ja — og så skal sitet have et
   samtykkebanner.

   Med en knap forholder det sig anderledes: trykker man på den, HAR man
   udtrykkeligt bedt om kalenderen, og hentningen er lovlig i sig selv
   (cookiebekendtgørelsen § 4). Sitet slipper dermed for et banner, så
   længe Cal er den eneste tredjepart — fonte og alt andet er selvhostet.

   Rul den ikke tilbage til et almindeligt script uden også at bygge
   et samtykkebanner.

   Parametre (dict):
     ns      — Cal-namespace, fx "book"
     calLink — fx "wiktoria-gordon" eller "wiktoria-gordon/lash-lift"
     minh    — minimumshøjde (default 850)
*/ -}}
{{- $ns := .ns -}}
{{- $link := .calLink -}}
{{- $minh := .minh | default 850 -}}
<div class="cal-slot" data-cal-ns="{{ $ns }}" data-cal-link="{{ $link }}" data-cal-minh="{{ $minh }}">
  <div class="cal-invite">
    <span class="cal-invite-ic" aria-hidden="true">{{ partial "icon.html" "clock" }}</span>
    <h3>{{ i18n "cal_invite_heading" }}</h3>
    <p>{{ i18n "cal_invite_text" }}</p>
    <button type="button" class="btn btn--primary cal-load"
            data-loading="{{ i18n "cal_invite_loading" }}">{{ i18n "cal_invite_button" }}</button>
  </div>
  <div class="cal-mount" id="cal-inline-{{ $ns }}"
       style="width:100%;min-height:{{ $minh }}px;overflow:visible;display:none"></div>
</div>
