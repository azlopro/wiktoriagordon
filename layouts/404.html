{{ define "main" }}
<section class="section error-page">
  <div class="container error-page__inner">
    <p class="eyebrow eyebrow--center">{{ i18n "err_eyebrow" }}</p>
    <h1>{{ i18n "err_heading" }}</h1>
    <p class="hero-sub error-page__text">{{ i18n "err_text" }}</p>
    <div class="hero-actions error-page__actions">
      <a href="{{ "/" | relLangURL }}" class="btn btn--primary">{{ i18n "err_home" }}</a>
      <a href="{{ "/#booking" | relLangURL }}" class="btn btn--ghost">{{ i18n "err_book" }}</a>
    </div>
  </div>
</section>
{{ end }}
