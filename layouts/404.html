{{ define "main" }}
{{- $u := index hugo.Data.ui .Site.Language.Lang -}}
<section class="section error-page">
  <div class="container error-page__inner">
    <p class="eyebrow eyebrow--center">{{ $u.error.eyebrow }}</p>
    <h1>{{ $u.error.heading }}</h1>
    <p class="hero-sub error-page__text">{{ $u.error.text }}</p>
    <div class="hero-actions error-page__actions">
      <a href="{{ "/" | relLangURL }}" class="btn btn--primary">{{ $u.error.home }}</a>
      <a href="{{ "/#booking" | relLangURL }}" class="btn btn--ghost">{{ $u.error.book }}</a>
    </div>
  </div>
</section>
{{ end }}
