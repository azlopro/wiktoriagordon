{{ define "main" }}
<section class="section" style="min-height:70vh;display:grid;place-items:center;text-align:center;">
  <div class="container" style="max-width:560px;">
    <p class="eyebrow eyebrow--center">{{ i18n "err_eyebrow" }}</p>
    <h1>{{ i18n "err_heading" }}</h1>
    <p class="hero-sub" style="margin-inline:auto;">{{ i18n "err_text" }}</p>
    <div class="hero-actions" style="justify-content:center;">
      <a href="{{ "/" | relLangURL }}" class="btn btn--primary">{{ i18n "err_home" }}</a>
      <a href="{{ "/#booking" | relLangURL }}" class="btn btn--ghost">{{ i18n "err_book" }}</a>
    </div>
  </div>
</section>
{{ end }}
