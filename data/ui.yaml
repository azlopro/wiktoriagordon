# =====================================================================
#  Faste tekster i rammen om indholdet: menu, knapper, mærkater, footer,
#  fejlside og bookingkalender.
#
#  Lå før i i18n/da.toml og i18n/en.toml, hvor Wiktoria ikke kunne nå dem.
#  Nu er de her, så de kan redigeres i CMS'et under "Buttons & labels"
#  ligesom alt andet tekst på sitet.
#
#  Tilbage i i18n/ ligger kun de rene tilgængelighedstekster ("Spring til
#  hovedindhold", "Åbn menu", "Skift sprog"). De læses op af skærmlæsere,
#  ses aldrig af en almindelig besøgende, og skal ikke kunne slettes ved
#  et uheld.
# =====================================================================

