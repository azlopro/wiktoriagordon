  # =====================================================================
  #  Kvitteringssiden /tak/. Vises FØRST når depositummet er betalt, og
  #  det er derfor den fulde adresse står her og ikke andre steder på
  #  sitet. Wiktorias krav 26/8-2026.
  # =====================================================================
  thanks:
    waitHeading: "Vi venter på MobilePay"
    waitText: "Det tager som regel et øjeblik. Luk ikke siden."
    # Efter et minut. Saa venter vi paa HENDE, ikke paa os selv, og det skal
    # hun kunne se, i stedet for at sidde og kigge paa en snurrende cirkel.
    waitSlow: "Har du godkendt betalingen i MobilePay? Vi venter stadig, så lad siden stå åben."
    doneEyebrow: "Din tid er booket"
    doneHeading: "Tak, {name}"
    doneText: "Depositummet er modtaget, og tiden er din. Der er ikke sendt en bekræftelse på mail, så gem den her side eller læg aftalen i din kalender."
    # Tre kalendere at vaelge imellem, som alle andre gør det. Der stod et
    # stykke tid EEN knap, der rettede sig efter telefonen og bar
    # Android-robotten. Det var forkert: Android er et styresystem, ikke en
    # kalender. Bland dem ikke sammen igen.
    calendarHeading: "Læg aftalen i din kalender"
    calendarApple: "Apple Kalender"
    calendarGoogle: "Google Kalender"
    calendarOutlook: "Outlook"
    calendarHint: "Apple henter en fil, som virker med alle kalendere. Tryk på den, når den er hentet."
    addressHeading: "Hvor"
    # Adressen oplyses KUN her, foerst efter betalt depositum. Lukker kunden
    # siden uden at gemme den, kan hun ikke finde salonen, og der er ingen
    # mail at slaa den op i. Derfor skal der staa det hoejt.
    addressNote: "Adressen står kun her. Gem siden, eller læg aftalen i din kalender nedenfor — så følger adressen med."
    prepHeading: "Inden du kommer"
    prepText: "Mød op uden mascara og uden makeup omkring øjne og bryn."
    policyText: "Husk at du kan aflyse eller flytte din tid indtil 24 timer før. Sker det senere, mistes depositummet."
    policyLink: "Politik & information"
    contactHeading: "Har du spørgsmål"
    cancelledHeading: "Betalingen blev ikke gennemført"
    cancelledText: "Der er ikke trukket nogen penge, og tiden er ikke booket. Du er velkommen til at prøve igen."
    failedHeading: "Tiden nåede desværre at blive booket"
    failedText: "Du er ikke blevet trukket. Vælg en anden tid, eller skriv til mig, så finder vi en."
    retryButton: "Vælg en ny tid"
    unknownHeading: "Vi kunne ikke finde den booking"
    unknownText: "Linket er måske for gammelt. Skriv til mig, så finder jeg din tid frem."
    # NOGET ANDET end unknown. En kunde, der var langsom i appen, fik foer
    # "vi kunne ikke finde den booking", og det lyder som om pengene er vaek.
    timeoutHeading: "Vi venter stadig på svar"
    timeoutText: "Betalingen er måske ikke godkendt endnu. Er du blevet trukket, er tiden din, og jeg kan altid finde den frem. Skriv til mig, så ser vi på det."

