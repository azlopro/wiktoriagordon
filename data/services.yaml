da:
  intro:
    eyebrow: "Behandlinger"
    heading: "Behandlinger, der tager udgangspunkt i dig"
    text: >-
      Ingen to ansigter er ens, og din behandling bør heller ikke være det. Hver
      tid tilpasses dine egne vipper eller bryn, dine træk og det resultat, du
      gerne vil have.
  main:
    - title: "Koreansk lash lift"
      group: "lashes"
      calSlug: "lash-lift"
      icon: "lash-tint"
      duration: "45–60 min."
      price: "500 kr."
      featured: false
      desc: >-
        En moderne løfteteknik, der giver et rent løft fra rod til spids, så dine
        naturlige vipper ser længere og fyldigere ud og øjnene åbner sig, uden
        vippebukker og uden extensions.
      expect:
        - "Vipper løftet fra rod til spids"
        - "Naturlige vipper, der ser længere og tykkere ud"
        - "Vipper farvet i den nuance, du vælger"
        - "Et resultat der holder 6-8 uger"
        - "At vågne op med vipperne klar hver dag"
      tagline: "Dine egne vipper, bare bedre."
    - title: "Brynlaminering"
      group: "brows"
      calSlug: "brow-lamination"
      icon: "brow"
      duration: "40–50 min."
      price: "450 kr."
      featured: false
      desc: >-
        En stylingbehandling, der lægger brynhårene i en fyldigere og mere
        struktureret form. Den kan give et løftet, fluffy udtryk, samtidig med at
        brynene forbliver bløde og lettere at style. Den perfekte løsning til
        genstridige, kraftige bryn.
      expect:
        - "Fyldigere og blødere bryn"
        - "En tydeligere brynform"
        - "Et løftet udtryk omkring øjnene"
        - "Mindre tid brugt på at style brynene"
      tagline: "Struktureret nok til at definere. Blødt nok til at føles som dig."
    - title: "Brynlaminering + farve"
      group: "brows"
      calSlug: "brow-lamination-tint"
      icon: "brow-tint"
      duration: "45–60 min."
      price: "500 kr."
      featured: false
      desc: >-
        Den komplette brynbehandling for mere form, dybde og definition.
        Lamineringen skaber retningen og strukturen, mens farven giver brynhårene
        dybde og en fyldigere finish.
      expect: []
      tagline: "Form, retning og definition i én behandling."
    - title: "Brynfarve & formning"
      group: "brows"
      calSlug: "brow-tint-shaping"
      icon: "sparkle"
      duration: "45–60 min."
      price: "400 kr."
      featured: false
      desc: >-
        Den rigtige brynform kan ændre balancen i hele dit ansigt. Dine bryn måles
        op efter dine egne træk, formes omhyggeligt og farves, så definitionen
        passer til dig.
      expect:
        - "Præcis brynopmåling og geometri"
        - "En farve tilpasset dine træk og dine ønsker"
        - "Mere balance i ansigtets træk"
        - "Renere definition i brynene"
        - "Mindre behov for brynmakeup til hverdag"
      tagline: "Målet er ikke perfekte bryn. Det er de rigtige bryn til dig."
    - title: "Brynopmåling & formning"
      group: "brows"
      calSlug: "brow-shaping"
      icon: "shape"
      duration: "30 min."
      price: "200 kr."
      featured: false
      desc: >-
        Det er aldrig en løsning, der passer til alle. Dine bryn måles op efter
        dine egne træk og ønsker og formes omhyggeligt med voks eller pincet.
      expect:
        - "Præcis brynopmåling og geometri"
        - "Mere balance i ansigtets træk"
        - "Renere definition i brynene"
      tagline: "Find din ideelle brynform."
