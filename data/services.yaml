      calSlug: "brow-tint-shaping"
      icon: "sparkle"
      duration: "45–60 min."
      price: "400 kr."
      featured: false
      desc: >-
        The right brow shape can subtly change the balance of your entire face.
        Your brows are mapped according to your individual features, carefully
        shaped and tinted to create definition that suits you.
      expect:
        - "Precise brow geometry and mapping"
        - "A tint tailored to your features and expectations"
        - "More balanced face features"
        - "Cleaner brow definition"
        - "Less need for daily brow makeup"
      tagline: "The goal isn't perfect brows. It's the right brows for you."
    - title: "Brow geometry & shaping"
      group: "brows"
      calSlug: "brow-shaping"
