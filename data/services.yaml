en:
  intro:
    eyebrow: "Treatments"
    heading: "Treatments designed around you."
    text: >-
      No two faces are the same, and your treatment shouldn't be either. Every
      appointment is adapted to your natural lashes or brows, your features and the
      result you want to achieve.
  main:
    - title: "Korean lash lift"
      group: "lashes"
      calSlug: "lash-lift"
      icon: "lash-tint"
      duration: "45–60 min."
      price: "500 kr."
      featured: false
      desc: >-
        A modern lash-lifting technique designed to create a clean lift from the
        roots to tips, making your natural lashes appear longer, fuller and
        eye-opening, without the need of lash curler or extensions.
      expect:
        - "Lifted lashes from the roots to tips"
        - "Longer and thicker looking natural lashes"
        - "Tinted lashes with colour of your choice"
        - "Result lasting up to 6-8 weeks"
        - "Waking up with your lashes ready everyday"
      tagline: "Your natural lashes, but better."
    - title: "Brow lamination"
      group: "brows"
      calSlug: "brow-lamination"
      icon: "brow"
      duration: "40–50 min."
      price: "450 kr."
      featured: false
      desc: >-
        A styling treatment that redirects the brow hairs into a fuller, more
        structured shape. It can create a lifted, fluffy appearance while keeping
        the brows soft and more manageable. Perfect solution for unruly, thicker
        brows.
      expect:
        - "Fuller, softer looking brows"
        - "More visible brow shape"
        - "A lifted appearance around the eyes"
        - "Less time spent styling your brows"
      tagline: "Structured enough to define. Soft enough to feel like you."
    - title: "Brow lamination + tint"
      group: "brows"
      calSlug: "brow-lamination-tint"
      icon: "brow-tint"
      duration: "45–60 min."
      price: "500 kr."
      featured: false
      desc: >-
        The complete brow treatment for more shape, depth and definition.
        Lamination creates the direction and structure, while tint adds depth to the
        brow hairs for a fuller-looking finish.
      expect: []
      tagline: "Shape, direction and definition in one treatment."
    - title: "Brow tint & shaping"
