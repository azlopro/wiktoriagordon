# =====================================================================
#  Anmeldelser — ORDRETTE citater fra Facebook, som Wiktoria selv har
#  udvalgt og sendt 22/8-2026.
#
#  ⚠️  Citaterne står på det sprog, kunden skrev dem på. Oversæt dem ikke:
#      et oversat citat er ikke længere det, personen skrev.
#
#  "lang" fortæller hvilket sprog citatet ER skrevet på. Wiktoria bad
#  4/9-2026 om, at den danske side kun viser de danske anmeldelser og den
#  engelske kun de engelske. Listen er den samme begge steder; det er
#  udelukkende "lang", der afgør hvilke der vises. Skrives der en ny
#  anmeldelse uden "lang", vises den på begge sprog.
#
#  "service" står tomt, hvor kunden ikke selv har nævnt behandlingen.
#  Det gættes ikke. Wiktoria kan udfylde dem i CMS'et.
# =====================================================================

