da:
  eyebrow: "Privatliv"
  heading: "Sådan behandler jeg dine oplysninger"
  updated: "Senest opdateret 27. august 2026"
  intro: >-
    Her kan du se, hvilke personoplysninger Wiktoria Gordon Beauty bruger,
    hvorfor de er nødvendige, og hvilke rettigheder du har.
  sections:
    - title: "Dataansvarlig"
      paragraphs:
        - >-
          Wiktoria Gordon Beauty, CVR 45930238, Fredericiagade, 8700 Horsens,
          er dataansvarlig. Du kan kontakte mig på gordonwiktoria@gmail.com,
          +45 52 61 53 80, via Instagram @wiktoriagordon.beauty eller via
          Facebook-siden Wiktoria Gordon Beauty.
    - title: "Oplysninger jeg behandler"
      paragraphs:
        - >-
          Når du booker, behandler jeg dit fornavn, efternavn, telefonnummer,
          den valgte behandling, tidspunktet og de oplysninger, der er
          nødvendige for at registrere depositummet. Jeg bruger også de
          oplysninger, du selv sender, hvis du kontakter mig via telefon eller
          sociale medier.
        - >-
          Send ikke oplysninger om helbred eller allergier gennem
          bookingformularen. Oplysninger, du giver under konsultationen, bliver
          ikke lagt i online-bookingen.
    - title: "Formål og retsgrundlag"
      paragraphs:
        - >-
          Oplysningerne bruges til at oprette og administrere din tid,
          kontakte dig om aftalen, registrere betaling og håndtere aflysning
          eller ombooking. Behandlingen sker for at indgå eller opfylde aftalen
          med dig, jf. GDPR artikel 6, stk. 1, litra b.
        - >-
          Oplysninger kan desuden opbevares, når det er nødvendigt for at
          overholde bogføringsregler, jf. artikel 6, stk. 1, litra c, eller for
          at dokumentere aftaler, forebygge misbrug og håndtere retskrav, jf.
          artikel 6, stk. 1, litra f.
    - title: "Hvem oplysninger deles med"
      paragraphs:
        - >-
          Ved online-booking deles oplysninger kun med leverandører, der er
          nødvendige for at drive hjemmesiden, kalenderen, bookingen og
          betalingen. Det omfatter Cloudflare, Cal.com, Vipps MobilePay og den
          kalenderudbyder, som forbindes med bookingen. Leverandørerne modtager
          kun de oplysninger, der er nødvendige for deres opgave.
        - >-
          Jeg sælger ikke dine oplysninger og bruger dem ikke til annoncering
          eller profilering. Hvis en leverandør behandler oplysninger uden for
          EU/EØS, sker det kun på et lovligt overførselsgrundlag.
    - title: "Hvor længe oplysninger gemmes"
      paragraphs:
        - >-
          Bookingoplysninger gemmes kun, så længe de er nødvendige for at
          gennemføre aftalen, håndtere ombooking eller aflysning og behandle
          eventuelle krav. Betalings- og bogføringsoplysninger gemmes så længe,
          som lovgivningen kræver. Oplysninger slettes eller anonymiseres, når
          formålet og en eventuel lovpligtig frist er udløbet.
    - title: "Dine rettigheder"
      paragraphs:
        - >-
          Du kan efter omstændighederne bede om indsigt, rettelse, sletning,
          begrænsning eller udlevering af dine oplysninger og gøre indsigelse
          mod en behandling. Kontakt mig via oplysningerne ovenfor. Jeg kan
          bede om dokumentation, hvis det er nødvendigt for at sikre, at
          oplysningerne udleveres til den rigtige person.
        - >-
          Du kan klage over behandlingen til Datatilsynet. Der træffes ingen
          automatiske afgørelser, og oplysningerne bruges ikke til profilering.
    - title: "Cookies og eksterne tjenester"
      paragraphs:
        - >-
          Den offentlige hjemmeside bruger ikke analyse- eller
          markedsføringscookies. Når du selv åbner Instagram, Facebook eller
          MobilePay, gælder den pågældende tjenestes egne privatlivs- og
          cookieoplysninger.
  authorityLabel: "Datatilsynet"
  authorityUrl: "https://www.datatilsynet.dk/"

en:
  eyebrow: "Privacy"
  heading: "How I handle your information"
  updated: "Last updated 27 August 2026"
  intro: >-
    This notice explains which personal data Wiktoria Gordon Beauty uses, why
    it is needed and which rights you have.
  sections:
    - title: "Data controller"
      paragraphs:
        - >-
          Wiktoria Gordon Beauty, CVR 45930238, Fredericiagade, 8700 Horsens,
          is the data controller. You can contact me at
          gordonwiktoria@gmail.com, on +45 52 61 53 80, via Instagram
          @wiktoriagordon.beauty or through the Facebook page Wiktoria Gordon
          Beauty.
    - title: "Information I process"
      paragraphs:
        - >-
          When you book, I process your first name, last name, phone number,
          chosen treatment, appointment time and the information needed to
          register your deposit. I also use information you choose to send
          when contacting me by phone or social media.
        - >-
          Do not send health or allergy information through the booking form.
          Information you provide during the consultation is not added to the
          online booking.
    - title: "Purposes and legal bases"
      paragraphs:
        - >-
          I use the information to create and manage your appointment, contact
          you about it, register payment and handle cancellation or
          rescheduling. This is necessary to enter into or perform our
          agreement under GDPR Article 6(1)(b).
        - >-
          Information may also be retained when necessary to comply with
          bookkeeping rules under Article 6(1)(c), or to document agreements,
          prevent misuse and handle legal claims under Article 6(1)(f).
    - title: "Who receives the information"
      paragraphs:
        - >-
          For online booking, information is shared only with providers needed
          to operate the website, calendar, booking and payment. These include
          Cloudflare, Cal.com, Vipps MobilePay and the calendar provider
          connected to the booking. Each provider receives only the information
          needed for its task.
        - >-
          I do not sell your information or use it for advertising or
          profiling. If a provider processes information outside the EU/EEA,
          this takes place only under a lawful transfer mechanism.
    - title: "How long information is kept"
      paragraphs:
        - >-
          Booking information is kept only for as long as needed to complete
          the appointment, manage rescheduling or cancellation and handle any
          claims. Payment and bookkeeping records are kept for as long as the
          law requires. Information is deleted or anonymised when its purpose
          and any legally required retention period have ended.
    - title: "Your rights"
      paragraphs:
        - >-
          Depending on the circumstances, you may request access, correction,
          deletion, restriction or a copy of your information, and you may
          object to processing. Contact me using the details above. I may ask
          for proof of identity where needed to ensure information is given to
          the correct person.
        - >-
          You may complain about the processing to the Danish Data Protection
          Agency. No automated decisions are made and your information is not
          used for profiling.
    - title: "Cookies and external services"
      paragraphs:
        - >-
          The public website does not use analytics or marketing cookies. If
          you choose to open Instagram, Facebook or MobilePay, that service's
          own privacy and cookie information applies.
  authorityLabel: "Danish Data Protection Agency"
  authorityUrl: "https://www.datatilsynet.dk/english/"
