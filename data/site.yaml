da:
  hero:
    eyebrow: "Koreansk lash lift · Brynstyling · Horsens"
    heading: "Skønhed, {tilpasset dig}"
    subheading: >-
      Gennemtænkte vippe- og brynbehandlinger, der åbner blikket, definerer
      brynene og skaber balance i dine træk, og samtidig holder resultatet
      blødt, naturligt og umiskendeligt dig.
    primaryCta: "Se behandlinger"
    secondaryCta: "Book din tid"

  strip:
    - "Koreansk lash lift"
    - "Brynlaminering"
    - "Brynopmåling"
    - "Horsens"

  intro:
    heading: "Nogle gange ændrer én lille detalje alt."
    paragraphs:
      - "Hele dit udtryk behøver ikke altid at laves om."
      - >-
        Små justeringer kan få dine træk til at fremstå mere balancerede,
        definerede og velplejede, uden at du kommer til at ligne en anden.
    closing: "Forstærkning, ikke forvandling."

  about:
    eyebrow: "Om mig"
    heading: "Skønhed er mere end resultatet. Det er, hvordan du har det undervejs og bagefter."
    paragraphs:
      - >-
        Fra begyndelsen ønskede jeg at skabe et sted, hvor du kan sænke farten,
        føle dig lyttet til og virkelig taget hånd om.
      - >-
        Jeg mener, at enhver kvinde fortjener at føle sig tilpas og velkommen fra
        det øjeblik, hun træder ind ad døren. Derfor har det altid været lige så
        vigtigt for mig at skabe en varm, privat og personlig ramme som selve
        behandlingen.
    pullquote: "Et øjeblik, der udelukkende er dit."
    moreButton: "Læs mere"
    moreIntro:
      - >-
        Hverdagen kan være travl, og nogle gange har vi bare brug for lidt tid væk
        fra alt det andet.
      - >-
        Jeg ville have, at din tid hos mig skulle føles som en lille pause fra
        hverdagens pligter. Et øjeblik til at slappe af, koble fra og nyde at
        passe på dig selv. Ingen hastværk, intet pres, bare tid til at trække
        vejret og være til stede.
    moreHeading: "Hvorfor vipper og bryn?"
    moreParagraphs:
      - >-
        Jeg har valgt at specialisere mig i koreansk lash lift og brynbehandlinger,
        fordi jeg tror på, at det kan gøre en stor forskel at forstærke dine
        naturlige træk.
      - >-
        De mindste detaljer kan ændre den måde, dit ansigt ser ud på, og endnu
        vigtigere den måde, du har det på, når du ser dig i spejlet. Jeg elsker at
        skabe resultater, der stadig føles som dig, bare en anelse mere definerede
        og forfinede.
      - >-
        Og noget af det, jeg holder allermest af ved mit arbejde, er at se det ægte
        smil, når en kunde ser sit resultat for første gang. Netop det øjeblik,
        hvor hun ser sig i spejlet og har det godt med det, hun ser, er præcis
        derfor, jeg skabte mit studie.
    closing: "Du tilbringer hver eneste dag med dig selv. Du fortjener at have det bedst muligt."

  pricing:
    eyebrow: "Priser"
    heading: "Prisliste"
    intro: "Klar og enkel. Hver tid begynder med en kort konsultation, så resultatet passer til netop dig."
    addonsTitle: "Tilvalg"
    asideTitle: "Book din tid"
    asideText: "Ikke sikker på, hvad du skal vælge? Skriv til mig, så finder vi den rette behandling sammen."
    cta: "Book tid"
    note: "Ved booking betales 200 kr. i depositum via MobilePay. Resten betales efter din behandling."

  booking:
    eyebrow: "Book tid"
    heading: "Ikke sikker på, hvor du skal starte?"
    text: >-
      Fortæl mig bare, hvad du gerne vil forbedre eller ændre, så hjælper jeg dig
      med at finde den behandling, der er den rigtige for dig.
    online: false
    onlineEmbed: ""
    treatmentButton: "Find din behandling"
    bookButton: "Book en tid"
    note: "Svar inden for 24 timer · Aflysning senest 24 timer før"

  contact:
    area: "Horsens, Danmark"

  beforeafter:
    # Overskriften vises ikke på siden. Sektionen står lige under
    # introteksten, og billederne taler for sig selv. Den bruges til
    # sidens overskriftsstruktur og til skærmlæsere.
    heading: "Se forskellen."
    beforeLabel: "Før"
    afterLabel: "Efter"

  finalcta:
    heading: "Dine træk. Din stil. Din behandling."
    text: "Lidt tid til dig. En forskel, du vil lægge mærke til."

en:
  hero:
    eyebrow: "Korean lash lift · Brow styling · Horsens"
    heading: "Beauty, {tailored to you}"
    subheading: >-
      Thoughtfully tailored lash and brow treatments designed to open up the eyes,
      define the brows and bring balance to your features, while keeping the
      result soft, natural and unmistakably you.
    primaryCta: "Explore treatments"
    secondaryCta: "Book your appointment"

  strip:
    - "Korean lash lift"
    - "Brow lamination"
    - "Brow mapping"
    - "Horsens"

  intro:
    heading: "Sometimes, one small detail changes everything."
    paragraphs:
      - "Your entire look doesn't always need changing."
      - >-
        Small adjustments can make your features look more balanced, defined and
        polished, without making you look like someone else.
    closing: "Enhancement, not transformation."

  about:
    eyebrow: "About me"
    heading: "Beauty is more than the result. It's how you feel during and after the experience."
    paragraphs:
      - >-
        From the very beginning, I wished to create a place where you can slow
        down, feel listened to and truly taken care of.
      - >-
        I believe every woman deserves to feel comfortable and welcomed from the
        moment she walks through the door. That is why creating a warm, private and
        personal environment has always been just as important to me as the
        treatment itself.
    pullquote: "A moment that is entirely yours."
    moreButton: "Read more"
    moreIntro:
      - >-
        Life can be busy, and sometimes we simply need a little time away from
        everything else.
      - >-
        I wanted your appointment to feel like a small pause from everyday
        responsibilities. A moment to relax, switch off and enjoy taking care of
        yourself. No rushing, no pressure, just time to breathe and be present.
    moreHeading: "Why lashes & brows?"
    moreParagraphs:
      - >-
        I chose to specialise in Korean lash lift and brow treatments, because I
        believe enhancing your natural features can have a powerful effect.
      - >-
        The smallest details can change the way your face looks and, more
        importantly, the way you feel when you look in the mirror. I love creating
        results that still feel like you, just a little more defined and refined.
      - >-
        And one of my favourite parts of what I do is seeing that genuine smile
        when a client sees her result for the first time. That moment, when she
        looks in the mirror and feels good about what she sees, is exactly why I
        created my beauty studio.
    closing: "You spend every day with yourself. You deserve to feel your best."

  pricing:
    eyebrow: "Prices"
    heading: "Price list"
    intro: "Clear and simple. Every appointment begins with a short consultation so the result suits you perfectly."
    addonsTitle: "Add-ons"
    asideTitle: "Book your appointment"
    asideText: "Not sure what to choose? Message me and we'll find the right treatment together."
    cta: "Book now"
    note: "A 200 kr. deposit is paid via MobilePay when you book. The remaining balance is payable after your appointment."

  booking:
    eyebrow: "Book"
    heading: "Not sure where to start?"
    text: >-
      Simply tell me what you'd like to improve or change, and I'll help you find
      the treatment that's right for you.
    online: false
    onlineEmbed: ""
    treatmentButton: "Find your treatment"
    bookButton: "Book an appointment"
    note: "Reply within 24 hours · Cancellation at least 24 hours ahead"

  contact:
    area: "Horsens, Denmark"

  beforeafter:
    # Overskriften vises ikke på siden. Sektionen står lige under
    # introteksten, og billederne taler for sig selv. Den bruges til
    # sidens overskriftsstruktur og til skærmlæsere.
    heading: "See the difference."
    beforeLabel: "Before"
    afterLabel: "After"

  finalcta:
    heading: "Your features. Your style. Your treatment."
    text: "A little time for you. A difference you'll notice."
